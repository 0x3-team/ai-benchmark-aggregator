sourceClasses:
  - sourceClassId: official-result-api
    priority: 1
    methodFamily: Approved official result API
    candidateUse: Locate structured result endpoints and immutable revision evidence.
    discoveryOnly: false
    captureRequiresSeparateCertification: true
    publicationRequiresSeparateDecision: true
  - sourceClassId: revision-pinned-structured-artifact
    priority: 2
    methodFamily: Revision-pinned official JSON, CSV, Parquet, or repository release artifact
    candidateUse: Locate complete structured artifacts with immutable revisions.
    discoveryOnly: false
    captureRequiresSeparateCertification: true
    publicationRequiresSeparateDecision: true
  - sourceClassId: official-manifest-or-export
    priority: 3
    methodFamily: Official dataset manifest, file manifest, or spreadsheet export
    candidateUse: Locate complete official file sets and export metadata.
    discoveryOnly: false
    captureRequiresSeparateCertification: true
    publicationRequiresSeparateDecision: true
  - sourceClassId: deterministic-structured-page
    priority: 4
    methodFamily: Deterministic official HTML or embedded structured data
    candidateUse: Locate stable structured records when stronger formats are unavailable.
    discoveryOnly: false
    captureRequiresSeparateCertification: true
    publicationRequiresSeparateDecision: true
  - sourceClassId: browser-rendered-reconnaissance
    priority: 5
    methodFamily: Bounded browser-rendered official-surface reconnaissance
    candidateUse: Discover official leads and detect rendering changes only.
    discoveryOnly: true
    captureRequiresSeparateCertification: true
    publicationRequiresSeparateDecision: true
refreshPolicy:
  discoveryPlanningCadence: PT12H
  registryReconciliationCadence: P1D
  coverageOwnerReviewCadence: P30D
  stalenessThreshold: P30D
  termsReviewPolicy: Per-target terms evidence and cadence; pause rather than crawl when access is not permitted.
  sourceRecheckAuthority: separate_certified_source_contract_only
exclusions:
  - exclusionId: arbitrary-internet-surfaces
    excludedClass: arbitrary_internet
    reasonCode: OUTSIDE_BOUNDED_UNIVERSE
    rationale: Search-engine results and arbitrary web crawling do not define the reviewed coverage denominator.
    reconsiderationPolicy: Add only through a new owner-reviewed universe revision with a governed official root.
    ownerRole: product_data_governance_owner
    reviewDueOn: "2026-08-15"
  - exclusionId: nonofficial-secondary-content
    excludedClass: nonofficial_secondary_content
    reasonCode: NONOFFICIAL_SOURCE_CLASS
    rationale: Articles, vendor blogs, newsletters, and social posts cannot become Official result evidence.
    reconsiderationPolicy: They may provide manual leads only when independently verified at an official origin.
    ownerRole: product_data_governance_owner
    reviewDueOn: "2026-08-15"
  - exclusionId: preview-or-incomplete-artifacts
    excludedClass: preview_or_incomplete_artifact
    reasonCode: INCOMPLETE_RESULT_ARTIFACT
    rationale: Preview and partial artifacts cannot satisfy complete result-record accounting.
    reconsiderationPolicy: Reconsider only when a complete official artifact and completeness rule are available.
    ownerRole: ledger_review_owner
    reviewDueOn: "2026-08-15"
  - exclusionId: terms-or-permission-blocked
    excludedClass: terms_or_permission_blocked
    reasonCode: TERMS_OR_PERMISSION_BLOCKED
    rationale: Automation must not violate terms or access restrictions to improve coverage.
    reconsiderationPolicy: Reconsider after explicit permission or a documented terms review permits the exact access.
    ownerRole: product_data_governance_owner
    reviewDueOn: "2026-08-15"
  - exclusionId: access-controlled-without-authority
    excludedClass: access_controlled_without_authority
    reasonCode: ACCESS_AUTHORITY_MISSING
    rationale: Credentials or private access are not implied by a configured benchmark or route.
    reconsiderationPolicy: Reconsider only after named credential, privacy, and recipient authority is approved.
    ownerRole: security_privacy_owner
    reviewDueOn: "2026-08-15"
  - exclusionId: derived-or-recalculated-scores
    excludedClass: derived_or_recalculated_score
    reasonCode: SOURCE_REPORTED_VALUE_REQUIRED
    rationale: The ledger records source-reported claims and does not recompute benchmark scores.
    reconsiderationPolicy: Do not admit as an Official claim; presentation-only calculations remain outside the ledger.
    ownerRole: ledger_review_owner
    reviewDueOn: "2026-08-15"
publicWording:
  coverageLabel: Bounded configured coverage
  scopeStatement: >-
    This revision accounts for 42 configured benchmark IDs and 53 configured
    source-route IDs in the pinned local registries.
  requiredDisclaimer: >-
    Configured, active, discovered, or present in this census does not mean a
    source is certified, a claim is approved, a result is published, or the
    internet and model ecosystem are complete.
  forbiddenClaims:
    - all benchmarks on the internet
    - all models or evaluated systems
    - all official result sources
    - configured means certified
    - active means approved or published
    - discovery candidate means Official evidence
