[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-ledger"
version = "0.1.0"
description = "Official benchmark result capture ledger (immutable source-backed claims)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "SQLAlchemy>=2.0",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.3,<4",
  "typer>=0.12",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pyarrow>=23.0.1,<24",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.0",
]

[project.scripts]
benchmark-ledger = "app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
