name: Change description
body:
  - type: markdown
    attributes:
      value: |
        ## Trust-boundary reminder

        Demo values are synthetic. Candidate projections, legacy reports, test fixtures,
        samples, ignored local exports, and source-fetch output are never public Official
        data. Official mode remains unavailable unless a separately governed REL-05
        authorization pins one release artifact and digest.

  - type: textarea
    id: summary
    attributes:
      label: Summary and user impact
      description: What changed, why, and which launch track/status it affects.
      placeholder: |
        - Keeps the visible dataset in Demo (synthetic).
        - Adds a fail-closed validation check for a governed future artifact.
    validations:
      required: true

  - type: dropdown
    id: trust_surface
    attributes:
      label: Trust surface
      options:
        - "UI only — no dataset or Official-mode behavior"
        - "Demo/unavailable status or frontend containment"
        - "Ledger schema, source, fetch, claim, review, or publication boundary"
        - "CI, release process, security, or documentation"
        - "Governed Official release work (requires linked approval)"
    validations:
      required: true

  - type: checkboxes
    id: containment
    attributes:
      label: Containment checks
      options:
        - label: "I did not make candidate, legacy, sample, ignored local-export, or fixture data a frontend input."
          required: true
        - label: "I did not enable Official mode, live ingestion, public export, benchmark execution, or production secrets in CI."
          required: true
        - label: "I did not overwrite claims/snapshots or use reset, delete, truncate, downgrade, or destructive migration recovery."
          required: true
        - label: "If this touches score display, it preserves DatasetProvider/getValue and truthful no-data behavior."
          required: true

  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: List exact commands, fixtures, browser/manual checks, and their result. Do not claim unrun environments.
      placeholder: |
        - npm run typecheck
        - npm test -- src/lib/aggregate.test.ts
        - cd ledger && pytest -q tests/test_safe_fetch.py
    validations:
      required: true

  - type: textarea
    id: data_governance
    attributes:
      label: Data/governance impact (if applicable)
      description: Name source revision, policy/decision IDs, artifact digest, review authority, or explicitly state “not applicable”.
      placeholder: "Not applicable — no ledger data, source, or Official artifact changed."
    validations:
      required: true

  - type: textarea
    id: migration_release
    attributes:
      label: Migration, release, or rollback impact
      description: State “not applicable” or link the copy-only rehearsal/release/withdrawal evidence. Never propose a downgrade as recovery.
      placeholder: "Not applicable — no durable schema, host, or release artifact changed."
    validations:
      required: true

  - type: checkboxes
    id: docs
    attributes:
      label: Documentation
      options:
        - label: "I updated relevant README, ADR, runbook, and/or plan documentation."
        - label: "No documentation change is needed; rationale is included above."
